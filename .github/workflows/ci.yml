name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        name: PHP ${{ matrix.php }} - ${{ matrix.dependencies }} deps
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Symfony 6.4, Doctrine ORM 2.20, PHPUnit 11
                    - php: '8.2'
                      dependencies: lowest
                    # Symfony 7.4
                    - php: '8.3'
                      dependencies: highest
                    # Symfony 8, with the optional PhpSpreadsheet exports
                    - php: '8.4'
                      dependencies: highest
                      spreadsheet: true
                    - php: '8.5'
                      dependencies: highest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo_sqlite, gd, zip
                  coverage: none

            - name: Require PhpSpreadsheet
              if: ${{ matrix.spreadsheet }}
              run: composer require --dev --no-update phpoffice/phpspreadsheet

            - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
              with:
                  dependency-versions: ${{ matrix.dependencies }}

            - run: vendor/bin/phpunit

    quality:
        name: PHPStan & PHP CS Fixer
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.2'
                  coverage: none

            - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

            - run: vendor/bin/phpstan analyse --no-progress
            - run: vendor/bin/php-cs-fixer fix --dry-run --diff
            - run: composer audit
